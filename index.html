<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Service Marketplace</title>

    <!-- Google Font (Inter) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN (no CLI needed) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0f172a",
              accent: "#06b6d4",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui"],
            },
          },
        },
      };
    </script>
    
  </head>

  <body class="font-sans">
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
  function initPlaces() {
    const input = document.getElementById("ls-location-input");
    if (!input || !google || !google.maps || !google.maps.places) return;
    const ac = new google.maps.places.Autocomplete(input, { types: ["(cities)"] });
    ac.addListener("place_changed", () => {
      const place = ac.getPlace();
      if (place && place.formatted_address) {
        input.value = place.formatted_address;
        // also save to localStorage if you like:
        localStorage.setItem("ls_location", place.formatted_address);
      }
    });
  }
  // call on load
  window.onload = initPlaces;
</script>

  </body>
</html>
